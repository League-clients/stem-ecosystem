name: Deploy to GitHub Pages

# Daily rebuild so the site picks up the scraper container's latest bucket
# data, plus manual runs: Actions -> Deploy -> Run workflow, or
# `gh workflow run deploy.yml`.
on:
  schedule:
    # 14:00 UTC = 06:00 PST / 07:00 PDT, after the container's 03:00-05:00 PT jobs.
    - cron: '0 14 * * *'
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      # Always refresh: never build stale or absent data (prebuild only
      # fetches when files are missing). Public HTTPS, no secrets.
      - name: Fetch site data
        run: npm run fetch-data

      - name: Build with Astro
        run: |
          npm run build -- \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
